# Netlify settings for the Corporate Cleaning Solutions site.
# Deploy with: scripts/netlify-deploy.sh corporate-cleaning-solutions   (draft, 0 credits)
#              scripts/netlify-deploy.sh corporate-cleaning-solutions --prod   (15 credits)
# The HTML is pre-built and committed, so there is no build command.
# Security and cache headers live in site/_headers (generated by tools/build/build.mjs),
# so they apply however the site is deployed.
[build]
  publish = "site"
  # If the repo is ever Git-connected: only build when this site's output or config changed.
  # A skipped build never becomes a production deploy, so it costs no deploy credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify.toml"
